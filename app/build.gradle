plugins {
id 'com.android.application'
}

android {
namespace 'com.techzone.cloner'
compileSdk 34

defaultConfig {
applicationId "com.techzone.cloner"
minSdk 24
targetSdk 34
versionCode 2
versionName "2.0"
}

buildTypes {
release {
minifyEnabled false
}
}
compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
packagingOptions {
resources {
excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/.SF', 'META-INF/.DSA', 'META-INF/*.RSA']
}
}
}

dependencies {
implementation 'androidx.appcompat:appcompat:1.6.1'
implementation 'com.google.android.material:material:1.11.0'
implementation 'com.android.tools.build:apksig:8.2.2'
implementation 'org.bouncycastle:bcprov-jdk15to18:1.76'
implementation 'org.bouncycastle:bcpkix-jdk15to18:1.76'
}
